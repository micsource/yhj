<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘宝客精选</title>
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .goods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .goods-card { border: 1px solid #eee; padding: 10px; border-radius: 8px; text-align: center; }
        .goods-card img { max-width: 100%; height: auto; }
        h3 { font-size: 14px; height: 40px; overflow: hidden; }
        a { display: inline-block; background: #ff4444; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>每日精选好物</h1>
    <div class="goods-grid">
        
        <div class="goods-card">
            <img src="https://via.placeholder.com/300" alt="测试商品1">
            <h3>测试商品1</h3>
            <p>券后价: ¥4.9</p>
            <a href="https://s.click.taobao.com/t?e=m%3D2%26s=123456%26pid=mm_24422371_13734488_109853100055" target="_blank">立即领券</a>
        </div>
        
        <div class="goods-card">
            <img src="https://via.placeholder.com/300" alt="测试商品2">
            <h3>测试商品2</h3>
            <p>券后价: ¥9.9</p>
            <a href="https://s.click.taobao.com/t?e=m%3D2%26s=789012%26pid=mm_24422371_13734488_109853100055" target="_blank">立即领券</a>
        </div>
        
    </div>
    <footer>
        <p>更新时间: <span id="update-time"></span></p>
    </footer>
    <script>
        document.getElementById('update-time').innerText = new Date().toLocaleString();
    </script>
</body>
</html>
