<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘宝客精选</title>
     <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; color: #ff4444; margin-bottom: 6px; }
        .header p { font-size: 13px; color: #999; }

        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .goods-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            transition: transform .2s, box-shadow .2s;
        }
        .goods-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.12); }
        .goods-card a { display: block; color: inherit; text-decoration: none; }

        .goods-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f0f0;
            display: block;
        }
        .goods-info { padding: 10px 12px 12px; }
        .goods-title {
            font-size: 13px;
            line-height: 1.45;
            color: #333;
            height: 38px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 8px;
        }
        .price-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .coupon-price { font-size: 19px; font-weight: 700; color: #ff4444; }
        .original-price { font-size: 12px; color: #999; text-decoration: line-through; }
        .coupon-tag {
            background: #ff4444;
            color: #fff;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: auto;
        }
        .commission-row { display: flex; justify-content: space-between; font-size: 12px; color: #999; }
        .commission { color: #ff6600; font-weight: 600; }

        .empty { grid-column: 1 / -1; text-align: center; color: #999; padding: 60px 0; }
        footer { text-align: center; font-size: 12px; color: #bbb; margin-top: 30px; }
    </style>
</head>

    <div class="header">
        <h1>每日精选好物</h1>
        <p>每日自动更新高性价比优惠商品</p>
    </div>

    <div class="goods-grid">
        <!-- GOODS_LIST -->
    </div>

     <footer>
        更新时间：<span id="update-time"></span></p>
    </footer>

     <script>
        // 仅用于兜底展示浏览器当前时间，商品数据不在这里渲染
        document.getElementById('update-time').innerText = new Date().toLocaleString('zh-CN');
    </script>
</body>
</html>
